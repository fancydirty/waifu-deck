apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.waifudeck.sync'
version = '1.0.0'

android {
  namespace "expo.modules.waifusync"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Board row 46: expo-image provides Glide and glide-plugin at runtime; module-shape.test.mjs keeps the versions equal to expo-image's.
  compileOnly 'com.github.bumptech.glide:glide:5.0.5'
  compileOnly 'com.github.penfeizhou.android.animation:glide-plugin:3.0.5'
}
